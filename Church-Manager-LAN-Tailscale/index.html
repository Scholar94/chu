<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Manager</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#16213e;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:700}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat{font-size:28px;font-weight:700}.muted{color:#68738a}.input,select,button{font:inherit}.input,select{width:100%;padding:11px;border:1px solid #ccd4e2;border-radius:9px;margin:5px 0 12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#e8edf5;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#16213e;color:#fff}.hidden{display:none}.login{max-width:430px;margin:8vh auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e8edf5;text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8edf5;font-size:12px}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.dangerText{color:#b91c1c}@media(max-width:600px){.top{padding:12px}.wrap{margin:12px auto}}
</style></head><body><div id="app"></div><script>
let token=localStorage.cmToken||'',me=null,data=null;const app=document.getElementById('app');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function boot(){try{const st=await api('/api/status',{headers:{}});if(st.license.status!=='ACTIVE')return license();if(!st.setupComplete)return setup();if(!token)return login();me=await api('/api/me');data=await api('/api/data');render()}catch(e){token='';localStorage.removeItem('cmToken');login()}}
function license(){app.innerHTML=`<div class="wrap login"><div class="card"><h1>Church Manager</h1><p class="muted">Step 1 of 2 — Activate this installation.</p><input class="input" id="key" placeholder="Paste vendor activation key"><button class="btn primary" onclick="activate()">Activate</button><p id="msg"></p></div></div>`}
async function activate(){try{await api('/api/activate',{method:'POST',body:JSON.stringify({key:$('#key').value})});location.reload()}catch(e){$('#msg').textContent=e.message}}
function setup(){app.innerHTML=`<div class="wrap login"><div class="card"><h1>Church Manager</h1><p class="muted">Step 2 of 2 — Create the church Owner account. No default password is supplied.</p><input class="input" id="cn" placeholder="Church name"><input class="input" id="on" placeholder="Owner / Pastor name"><input class="input" id="ou" placeholder="Owner username"><input class="input" id="op" type="password" placeholder="Password (8+ characters)"><button class="btn primary" onclick="finishSetup()">Create Owner account</button><p id="setupmsg"></p></div></div>`}
async function finishSetup(){try{await api('/api/setup',{method:'POST',body:JSON.stringify({churchName:$('#cn').value,ownerName:$('#on').value,username:$('#ou').value,password:$('#op').value})});location.reload()}catch(e){$('#setupmsg').textContent=e.message}}
function login(){app.innerHTML=`<div class="wrap login"><div class="card"><h1>Church Manager</h1><p class="muted">LAN + Tailscale Edition</p><input class="input" id="u" placeholder="Username"><input class="input" id="p" type="password" placeholder="Password"><button class="btn primary" onclick="doLogin()">Sign in</button></div></div>`}
async function doLogin(){try{let x=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})});token=x.token;localStorage.cmToken=token;boot()}catch(e){alert(e.message)}}
function render(){app.innerHTML=`<div class="top"><div class="brand">Church Manager</div><div>${esc(me.name)} · ${esc(me.role)} <button class="btn" onclick="logout()">Logout</button></div></div><div class="wrap"><div class="card"><div class="tabs">${['dashboard','members','attendance','events','giving','announcements','reports'].map(x=>`<button class="btn ${x==='dashboard'?'active':''}" onclick="page('${x}',this)">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}${me.role==='Owner'?'<button class="btn" onclick="staff()">Staff Accounts</button><button class="btn" onclick="audit()">Audit</button><button class="btn" onclick="backups()">Backup & Restore</button>':''}</div></div><div id="view"></div></div>`;page('dashboard')}
function page(p,el){document.querySelectorAll('.tabs .btn').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');let v=$('#view');if(p==='dashboard')v.innerHTML=`<div class="grid"><div class="card"><div class="muted">Members</div><div class="stat">${data.members.length}</div></div><div class="card"><div class="muted">Attendance records</div><div class="stat">${data.attendance.length}</div></div><div class="card"><div class="muted">Events</div><div class="stat">${data.events.length}</div></div><div class="card"><div class="muted">Giving</div><div class="stat">₦${data.giving.reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString()}</div></div></div><div class="card"><b>Connection</b><p class="muted">LAN and Tailscale access use the same server and shared database.</p></div>`;else if(p==='reports')v.innerHTML=`<div class="card"><h2>Reports</h2><pre>${esc(JSON.stringify(data.reports||{},null,2))}</pre></div>`;else if(['members','attendance','events','giving','announcements'].includes(p))v.innerHTML=listPage(p)}
function listPage(p){let rows=data[p]||[];let form={members:['Name','phone'],attendance:['Member','status'],events:['Title','date'],giving:['Member','amount'],announcements:['Title','message']}[p];return `<div class="card"><h2>${p[0].toUpperCase()+p.slice(1)}</h2><div class="grid">${form.map((x,i)=>`<div><label>${x}</label><input class="input" id="f${i}" ${x==='amount'?'type="number"':''}></div>`).join('')}</div><button class="btn primary" onclick="add('${p}',${form.length})">Add</button></div><div class="card"><table class="table"><tr>${form.map(x=>`<th>${x}</th>`).join('')}<th>Date</th></tr>${rows.map(r=>`<tr>${form.map(x=>`<td>${esc(r[x.toLowerCase()]??r[x]??'')}</td>`).join('')}<td>${esc(r.createdAt||'')}</td></tr>`).join('')}</table></div>`}
async function add(p,n){let o={};let keys={members:['name','phone'],attendance:['member','status'],events:['title','date'],giving:['member','amount'],announcements:['title','message']}[p];keys.forEach((k,i)=>o[k]=$('#f'+i).value);try{await api('/api/'+p,{method:'POST',body:JSON.stringify(o)});data=await api('/api/data');page(p)}catch(e){alert(e.message)}}
async function staff(){let n=prompt('Staff name');if(!n)return;let u=prompt('Username');if(!u)return;let p=prompt('Password (8+ characters)');if(!p)return;let r=prompt('Role: Admin, Secretary, Treasurer or Worker','Worker');try{await api('/api/users',{method:'POST',body:JSON.stringify({name:n,username:u,password:p,role:r})});alert('Staff account created');data=await api('/api/data');render()}catch(e){alert(e.message)}}
async function audit(){let x=await api('/api/audit');$('#view').innerHTML='<div class="card"><h2>Audit</h2><table class="table"><tr><th>Action</th><th>User</th><th>Time</th></tr>'+x.map(a=>`<tr><td>${esc(a.action)}</td><td>${esc(a.user)}</td><td>${esc(a.time)}</td></tr>`).join('')+'</table></div>'}
async function backups(){let list=await api('/api/backups');$('#view').innerHTML=`<div class="card"><h2>Backup & Restore</h2><p class="muted">Automatic daily backups are stored in the server's <b>backups</b> folder. Keep an additional copy on an external drive or secure cloud storage.</p><button class="btn primary" onclick="manualBackup()">Create Backup Now</button><hr><h3>Restore a backup file</h3><input class="input" id="restoreFile" type="file" accept=".json,application/json"><button class="btn danger" onclick="restoreFile()">Restore Selected Backup</button><p class="dangerText">Restoring replaces the current church records. A safety backup is created before restore.</p></div><div class="card"><h3>Available backups</h3><table class="table"><tr><th>File</th><th>Created</th><th>Size</th><th></th></tr>${list.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.createdAt)}</td><td>${Math.round(x.size/1024)} KB</td><td><button class="btn" onclick="downloadBackup('${encodeURIComponent(x.name)}')">Download</button></td></tr>`).join('')}</table></div>`}
async function manualBackup(){try{let x=await api('/api/backups',{method:'POST'});alert('Backup created: '+x.file);backups()}catch(e){alert(e.message)}}
async function restoreFile(){const f=$('#restoreFile')?.files?.[0];if(!f)return alert('Select a backup file first.');if(!confirm('Restore this backup? Current records will be replaced after a safety backup is created.'))return;try{const backup=JSON.parse(await f.text());await api('/api/backups/restore',{method:'POST',body:JSON.stringify({backup})});localStorage.removeItem('cmToken');alert('Backup restored. Please sign in again.');location.reload()}catch(e){alert(e.message)}}
async function downloadBackup(name){try{let r=await fetch('/api/backups/'+name,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Download failed');let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=decodeURIComponent(name);a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('cmToken');location.reload()}boot();
</script></body></html>
