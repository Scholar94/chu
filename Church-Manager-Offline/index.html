<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Manager Offline</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f7fb;color:#172033}.top{background:#16213e;color:white;padding:18px}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.card{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #0001}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd4e2;margin:4px}button{cursor:pointer}.primary{background:#2563eb;color:white;border:0}.danger{background:#dc2626;color:white;border:0}.stat{font-size:28px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#68738a}</style></head><body><div class="top"><b>Church Manager — Offline Edition</b></div><div class="wrap"><div class="card"><h2>Dashboard</h2><div class="grid"><div><small>Members</small><div class="stat" id="members">0</div></div><div><small>Events</small><div class="stat" id="events">0</div></div><div><small>Giving</small><div class="stat" id="giving">₦0</div></div></div></div><div class="card"><h2>Data Protection</h2><p class="muted">This edition stores records in this browser. Export a backup regularly and keep a copy outside the computer.</p><button class="primary" onclick="exportBackup()">Export Backup</button><input id="restore" type="file" accept="application/json,.json"><button class="danger" onclick="restoreBackup()">Restore Backup</button></div><div class="card"><h2>Add Member</h2><input id="name" placeholder="Member name"><input id="phone" placeholder="Phone"><button class="primary" onclick="addMember()">Save</button></div><div class="card"><h2>Members</h2><div id="list"></div></div></div><script>const KEY='cmOffline';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'{"members":[],"events":[],"giving":[]}')}catch{db={members:[],events:[],giving:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function addMember(){let n=document.getElementById('name').value.trim();if(!n)return;db.members.push({name:n,phone:document.getElementById('phone').value,createdAt:new Date().toISOString()});document.getElementById('name').value='';document.getElementById('phone').value='';save()}function render(){document.getElementById('members').textContent=db.members.length;document.getElementById('events').textContent=db.events.length;document.getElementById('giving').textContent='₦'+db.giving.reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString();document.getElementById('list').innerHTML=db.members.map((m,i)=>`<p><b>${i+1}. ${escapeHtml(m.name)}</b> — ${escapeHtml(m.phone||'')}</p>`).join('')||'<p>No members yet.</p>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportBackup(){const payload={format:'Church Manager Offline Backup v1',createdAt:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='church-manager-offline-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function restoreBackup(){const f=document.getElementById('restore').files[0];if(!f)return alert('Select a backup file first.');if(!confirm('Restore this backup and replace current offline records?'))return;try{const x=JSON.parse(await f.text());if(x.format!=='Church Manager Offline Backup v1'||!x.data)throw Error('Invalid offline backup');db=x.data;save();alert('Backup restored successfully.')}catch(e){alert(e.message)}}render();</script></body></html>
